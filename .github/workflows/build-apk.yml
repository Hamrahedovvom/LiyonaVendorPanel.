name: Build Liyona Vendor APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/liyona/vendorpanel
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'LiyonaVendorPanel'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.liyona.vendorpanel'
              compileSdk 35

              defaultConfig {
                  applicationId 'ir.liyona.vendorpanel'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">پنل فروشندگان لیونا</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:statusBarColor">#061D47</item>
                  <item name="android:navigationBarColor">#061D47</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/splash_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="135"
                  android:startColor="#031B45"
                  android:centerColor="#0757C8"
                  android:endColor="#03235E" />
          </shape>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:roundIcon="@drawable/icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ir/liyona/vendorpanel/MainActivity.java <<'EOF'
          package ir.liyona.vendorpanel;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowInsets;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private static final String URL =
                      "https://liyona.ir/vendor-dashboard/";

              private WebView webView;
              private View splash;
              private View pageLoader;
              private boolean firstLoad = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(6, 29, 71));
                  getWindow().setNavigationBarColor(Color.rgb(6, 29, 71));

                  buildUI();
                  setupInsets();
                  setupWebView();

                  webView.loadUrl(URL);
              }

              private void buildUI() {

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);

                  webView = new WebView(this);
                  webView.setVisibility(View.INVISIBLE);

                  root.addView(
                          webView,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  pageLoader = createPageLoader();
                  pageLoader.setVisibility(View.GONE);

                  FrameLayout.LayoutParams loaderParams =
                          new FrameLayout.LayoutParams(dp(150), dp(90));

                  loaderParams.gravity = Gravity.CENTER;

                  root.addView(pageLoader, loaderParams);

                  splash = createSplash();

                  root.addView(
                          splash,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  setContentView(root);
              }

              private View createSplash() {

                  LinearLayout layout = new LinearLayout(this);

                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(dp(30), dp(30), dp(30), dp(30));
                  layout.setBackgroundResource(R.drawable.splash_bg);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.icon);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  LinearLayout.LayoutParams logoParams =
                          new LinearLayout.LayoutParams(dp(130), dp(130));

                  logoParams.bottomMargin = dp(25);

                  layout.addView(logo, logoParams);

                  TextView title = new TextView(this);
                  title.setText("پنل فروشندگان لیونا");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(25);
                  title.setGravity(Gravity.CENTER);

                  layout.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("مدیریت فروشگاه، ساده و سریع");
                  sub.setTextColor(0xCCFFFFFF);
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams subParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );

                  subParams.topMargin = dp(8);
                  subParams.bottomMargin = dp(30);

                  layout.addView(sub, subParams);

                  ProgressBar progress = new ProgressBar(this);

                  LinearLayout.LayoutParams progressParams =
                          new LinearLayout.LayoutParams(dp(50), dp(50));

                  progressParams.bottomMargin = dp(15);

                  layout.addView(progress, progressParams);

                  TextView loading = new TextView(this);
                  loading.setText("در حال ورود به پنل...");
                  loading.setTextColor(Color.WHITE);
                  loading.setTextSize(13);

                  layout.addView(loading);

                  logo.animate()
                          .scaleX(1.08f)
                          .scaleY(1.08f)
                          .alpha(0.8f)
                          .setDuration(900)
                          .withEndAction(() ->
                                  logo.animate()
                                          .scaleX(1f)
                                          .scaleY(1f)
                                          .alpha(1f)
                                          .setDuration(900)
                                          .start()
                          )
                          .start();

                  return layout;
              }

              private View createPageLoader() {

                  LinearLayout box = new LinearLayout(this);

                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(15), dp(15), dp(15), dp(15));
                  box.setBackgroundColor(0xEEFFFFFF);
                  box.setElevation(dp(12));

                  ProgressBar progress = new ProgressBar(this);

                  LinearLayout.LayoutParams progressParams =
                          new LinearLayout.LayoutParams(dp(38), dp(38));

                  progressParams.bottomMargin = dp(8);

                  box.addView(progress, progressParams);

                  TextView text = new TextView(this);

                  text.setText("در حال بارگذاری...");
                  text.setTextColor(Color.rgb(3, 27, 69));
                  text.setTextSize(12);

                  box.addView(text);

                  return box;
              }

              private void setupInsets() {

                  View content = findViewById(android.R.id.content);

                  content.setOnApplyWindowInsetsListener((v, insets) -> {

                      int top = insets.getSystemWindowInsetTop();
                      int bottom = insets.getSystemWindowInsetBottom();

                      View child =
                              ((ViewGroup) content).getChildAt(0);

                      if (child != null) {
                          child.setPadding(0, top, 0, bottom);
                      }

                      return insets;
                  });
              }

              private void setupWebView() {

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance()
                          .setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageStarted(
                              WebView view,
                              String url,
                              android.graphics.Bitmap favicon
                      ) {

                          if (!firstLoad) {
                              pageLoader.setVisibility(View.VISIBLE);
                          }
                      }

                      @Override
                      public void onPageFinished(
                              WebView view,
                              String url
                      ) {

                          if (firstLoad) {

                              firstLoad = false;

                              webView.setVisibility(View.VISIBLE);

                              splash.animate()
                                      .alpha(0f)
                                      .setDuration(350)
                                      .withEndAction(() ->
                                              splash.setVisibility(View.GONE)
                                      )
                                      .start();

                          } else {

                              pageLoader.setVisibility(View.GONE);

                          }
                      }
                  });
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private int dp(int value) {

                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }
          }
          EOF

          cp icon-512.png app/src/main/res/drawable/icon.png

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-Vendor-Panel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
