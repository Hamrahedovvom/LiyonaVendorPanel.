name: Build Liyona Vendor APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/liyona/vendorpanel
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'LiyonaVendorPanel'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.liyona.vendorpanel'
              compileSdk 35

              defaultConfig {
                  applicationId 'ir.liyona.vendorpanel'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">پنل فروشندگان لیونا</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:statusBarColor">#FF2D8D</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/splash_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="270"
                  android:startColor="#FFF6FB"
                  android:centerColor="#FFF0F7"
                  android:endColor="#FFE5F1" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/card_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FFFFFFFF" />
              <corners android:radius="28dp" />
              <stroke
                  android:width="1dp"
                  android:color="#15FF2D8D" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/loader_box_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F2FFFFFF" />
              <corners android:radius="24dp" />
              <stroke
                  android:width="1dp"
                  android:color="#18FF2D8D" />
          </shape>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:roundIcon="@drawable/icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/ir/liyona/vendorpanel/MainActivity.java <<'EOF'
          package ir.liyona.vendorpanel;

          import android.app.Activity;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private static final String URL = "https://liyona.ir/vendor-dashboard/";

              private WebView webView;
              private View splashView;
              private View pageLoader;
              private boolean firstLoad = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.parseColor("#FF2D8D"));
                  getWindow().setNavigationBarColor(Color.WHITE);

                  buildUI();
                  setupInsets();
                  setupWebView();

                  if (savedInstanceState == null) {
                      webView.loadUrl(URL);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private void buildUI() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);

                  webView = new WebView(this);
                  webView.setVisibility(View.INVISIBLE);

                  root.addView(
                          webView,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  pageLoader = createPageLoader();
                  pageLoader.setVisibility(View.GONE);
                  pageLoader.setAlpha(0f);

                  root.addView(
                          pageLoader,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  splashView = createSplash();

                  root.addView(
                          splashView,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  setContentView(root);
              }

              private View createSplash() {
                  FrameLayout wrapper = new FrameLayout(this);
                  wrapper.setBackgroundResource(R.drawable.splash_bg);

                  LinearLayout main = new LinearLayout(this);
                  main.setOrientation(LinearLayout.VERTICAL);
                  main.setGravity(Gravity.CENTER_HORIZONTAL);
                  main.setPadding(dp(24), dp(36), dp(24), dp(36));

                  FrameLayout.LayoutParams mainParams =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          );

                  View topBar = new View(this);
                  topBar.setBackgroundColor(Color.parseColor("#FF2D8D"));
                  FrameLayout.LayoutParams topBarParams =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(68)
                          );
                  topBarParams.gravity = Gravity.TOP;
                  wrapper.addView(topBar, topBarParams);

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setGravity(Gravity.CENTER_HORIZONTAL);
                  card.setPadding(dp(28), dp(28), dp(28), dp(28));
                  card.setBackgroundResource(R.drawable.card_bg);
                  card.setElevation(dp(10));

                  LinearLayout.LayoutParams cardParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                  cardParams.topMargin = dp(80);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.icon);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  LinearLayout.LayoutParams logoParams =
                          new LinearLayout.LayoutParams(dp(110), dp(110));
                  logoParams.bottomMargin = dp(18);
                  card.addView(logo, logoParams);

                  TextView title = new TextView(this);
                  title.setText("پنل فروشندگان لیونا");
                  title.setTextColor(Color.parseColor("#1F2430"));
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  card.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("مدیریت سفارش‌ها، محصولات و فروشگاه");
                  sub.setTextColor(Color.parseColor("#8C6F7E"));
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams subParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                  subParams.topMargin = dp(10);
                  subParams.bottomMargin = dp(24);
                  card.addView(sub, subParams);

                  ProgressBar progress = new ProgressBar(this);
                  try {
                      progress.getIndeterminateDrawable()
                              .setTint(Color.parseColor("#FF2D8D"));
                  } catch (Exception ignored) {}

                  LinearLayout.LayoutParams progressParams =
                          new LinearLayout.LayoutParams(dp(42), dp(42));
                  progressParams.bottomMargin = dp(16);
                  card.addView(progress, progressParams);

                  TextView loading = new TextView(this);
                  loading.setText("در حال ورود به پنل فروشندگان...");
                  loading.setTextColor(Color.parseColor("#FF2D8D"));
                  loading.setTextSize(13);
                  loading.setGravity(Gravity.CENTER);
                  card.addView(loading);

                  main.addView(card, cardParams);

                  TextView footer = new TextView(this);
                  footer.setText("liyona.ir");
                  footer.setTextColor(Color.parseColor("#C07A97"));
                  footer.setTextSize(12);
                  footer.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams footerParams =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                  footerParams.topMargin = dp(28);

                  main.addView(footer, footerParams);

                  wrapper.addView(main, mainParams);

                  logo.animate()
                          .scaleX(1.07f)
                          .scaleY(1.07f)
                          .alpha(0.88f)
                          .setDuration(900)
                          .withEndAction(() ->
                                  logo.animate()
                                          .scaleX(1f)
                                          .scaleY(1f)
                                          .alpha(1f)
                                          .setDuration(900)
                                          .start()
                          )
                          .start();

                  return wrapper;
              }

              private View createPageLoader() {
                  FrameLayout overlay = new FrameLayout(this);
                  overlay.setBackgroundColor(0x99FFFFFF);

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(22), dp(22), dp(22), dp(22));
                  box.setBackgroundResource(R.drawable.loader_box_bg);
                  box.setElevation(dp(10));

                  ProgressBar progress = new ProgressBar(this);
                  try {
                      progress.getIndeterminateDrawable()
                              .setTint(Color.parseColor("#FF2D8D"));
                  } catch (Exception ignored) {}

                  LinearLayout.LayoutParams progressParams =
                          new LinearLayout.LayoutParams(dp(42), dp(42));
                  progressParams.bottomMargin = dp(10);
                  box.addView(progress, progressParams);

                  TextView text = new TextView(this);
                  text.setText("در حال بارگذاری...");
                  text.setTextColor(Color.parseColor("#6D5562"));
                  text.setTextSize(13);
                  text.setGravity(Gravity.CENTER);
                  box.addView(text);

                  FrameLayout.LayoutParams boxParams =
                          new FrameLayout.LayoutParams(
                                  dp(170),
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                  boxParams.gravity = Gravity.CENTER;

                  overlay.addView(box, boxParams);

                  return overlay;
              }

              private void setupInsets() {
                  View content = findViewById(android.R.id.content);

                  content.setOnApplyWindowInsetsListener((v, insets) -> {
                      int top = insets.getSystemWindowInsetTop();
                      int bottom = insets.getSystemWindowInsetBottom();

                      if (webView != null) {
                          webView.setPadding(0, top, 0, bottom);
                      }

                      return insets;
                  });

                  content.requestApplyInsets();
              }

              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);

                          if (!firstLoad) {
                              pageLoader.setVisibility(View.VISIBLE);
                              pageLoader.animate().alpha(1f).setDuration(180).start();
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          if (firstLoad) {
                              firstLoad = false;
                              webView.setVisibility(View.VISIBLE);

                              splashView.animate()
                                      .alpha(0f)
                                      .setDuration(350)
                                      .withEndAction(() -> splashView.setVisibility(View.GONE))
                                      .start();
                          } else {
                              pageLoader.animate()
                                      .alpha(0f)
                                      .setDuration(180)
                                      .withEndAction(() -> pageLoader.setVisibility(View.GONE))
                                      .start();
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          return !("http".equalsIgnoreCase(scheme) || "https".equalsIgnoreCase(scheme));
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          Uri uri = Uri.parse(url);
                          String scheme = uri.getScheme();
                          return !("http".equalsIgnoreCase(scheme) || "https".equalsIgnoreCase(scheme));
                      }
                  });
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) {
                      webView.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }
          }
          EOF

          cp icon-512.png app/src/main/res/drawable/icon.png

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liyona-Vendor-Panel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
